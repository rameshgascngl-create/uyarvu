name: UYARVU Android QA

on:
  push:
    branches: [ main, master, phase3c-development ]
  pull_request:
    branches: [ main, master, phase3c-development ]

jobs:
  kotlin-compile-and-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests, lint & build debug APK
        run: gradle testDebugUnitTest assembleDebug lintDebug --stacktrace
      - name: Upload Unit Test & Lint Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uyarvu-unit-and-lint-reports
          if-no-files-found: ignore
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results*
      - name: Upload QA Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uyarvu-qa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  privacy-and-bilingual-parity-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify no hardcoded secrets or tracking SDKs
        run: |
          ! grep -rnE "AIza[0-9A-Za-z_-]{35}|firebase|admob|facebook.ads" app/src/
      - name: Verify English & Tamil string key parity
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          en = {e.attrib['name'] for e in ET.parse('app/src/main/res/values/strings.xml').getroot()}
          ta = {e.attrib['name'] for e in ET.parse('app/src/main/res/values-ta/strings.xml').getroot()}
          assert en == ta, f"Mismatch: missing in ta={en-ta}, extra in ta={ta-en}"
          print(f"Verified {len(en)} bilingual string keys with 100% parity.")
          EOF

  api34-ui-instrumentation:
    runs-on: macos-14
    needs: [kotlin-compile-and-unit-tests, privacy-and-bilingual-parity-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: gradle connectedDebugAndroidTest
      - name: Upload Instrumentation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uyarvu-instrumentation-reports
          if-no-files-found: ignore
          path: app/build/reports/androidTests/
